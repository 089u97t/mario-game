services:
  game:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:8000"
    command: ["python", "run_pygbag.py", "--bind", "0.0.0.0", "--port", "8000", "test_game.py"]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
